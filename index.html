<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keren Wang'ombe | Program Operations</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <style>
        :root { --midnight: #1E2D40; --teal: #1A8B8B; --cloud: #F7F8FA; }
        body { font-family: 'DM Sans', sans-serif; background-color: var(--cloud); }
        h1, h2, h3, .serif { font-family: 'DM Serif Display', serif; }
        .header-mesh { background: linear-gradient(135deg, var(--midnight) 0%, #162130 100%); }
        .case-study-drawer { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-out; }
        .case-study-drawer.open { max-height: 2000px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('landing');

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="header-mesh pt-16 pb-24 px-6 text-center text-white">
                        <div className="max-w-3xl mx-auto">
                            <span className="uppercase tracking-[0.3em] text-[10px] text-teal-400 font-bold">Program Operations & Systems Design</span>
                            <h1 className="text-5xl md:text-7xl italic mt-4 mb-6">Keren Wang'ombe</h1>
                            <p className="text-white/70 text-lg font-light max-w-2xl mx-auto">
                                Engineering the operational infrastructure that enables programs to scale. Specialist in automation and data integrity for multi-country cohorts.
                            </p>
                        </div>
                    </header>

                    {/* Nav */}
                    <nav className="max-w-5xl mx-auto w-full px-4 -mt-8 relative z-20">
                        <div className="bg-white rounded-2xl shadow-xl p-2 flex gap-1">
                            {['landing', 'ops', 'ds'].map(id => (
                                <button 
                                    key={id} 
                                    onClick={() => setActiveTab(id)} 
                                    className={`flex-1 py-4 rounded-xl text-[11px] font-bold uppercase tracking-widest transition-all ${activeTab === id ? 'bg-[#1E2D40] text-white' : 'text-slate-400 hover:bg-slate-50'}`}
                                >
                                    {id === 'landing' ? 'About' : id === 'ops' ? 'Program Ops' : 'Data Analytics'}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-5xl mx-auto w-full px-4 py-16 flex-grow">
                        {activeTab === 'landing' ? (
                            <div className="bg-white rounded-3xl border border-slate-100 p-10 shadow-sm">
                                <h2 className="text-3xl serif italic mb-6">"Architecture over tools."</h2>
                                <p className="text-slate-600 leading-relaxed mb-6">
                                    I design the systems that allow 3,000+ learners across 8 countries to move from "Unknown to Known" seamlessly. 
                                    By bridging the gap between high-level goals and technical execution, I reclaim up to 15 hours a week for program teams through strategic automation.
                                </p>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <div className="text-2xl font-bold text-[#1A8B8B]">50%</div>
                                        <div className="text-[10px] uppercase font-bold text-slate-400">Manual Tasks Cut</div>
                                    </div>
                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <div className="text-2xl font-bold text-[#F0684C]">80%</div>
                                        <div className="text-[10px] uppercase font-bold text-slate-400">CSAT Score</div>
                                    </div>
                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <div className="text-2xl font-bold text-[#1E2D40]">98%</div>
                                        <div className="text-[10px] uppercase font-bold text-slate-400">Data Accuracy</div>
                                    </div>
                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                        <div className="text-2xl font-bold text-[#1A8B8B]">77</div>
                                        <div className="text-[10px] uppercase font-bold text-slate-400">Program NPS</div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-20">
                                <h2 className="text-2xl serif">Section details loading...</h2>
                                <p className="text-slate-400 mt-2">Click 'About' to see the updated metrics-first profile.</p>
                            </div>
                        )}
                    </main>

                    <footer className="bg-[#1E2D40] text-white py-12 px-6 text-center">
                        <p className="serif italic text-xl mb-4">Let's build a better system.</p>
                        <a href="mailto:kerenwangombe@gmail.com" className="bg-[#F0684C] px-8 py-3 rounded-xl uppercase text-[10px] font-bold tracking-widest">Email Me</a>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
